<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#0a0908" />
<title>Arkadia</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<!-- critical: paint the void immediately so the JS-imported stylesheet doesn't
     flash white on load. Background on body only (not html) so body-background
     propagation keeps the body box transparent and the z-index:-1 backdrop shows. -->
<style>html,body{margin:0;height:100%}body{background:#0a0908}</style>
</head>
<body>
  <div id="root"></div>
  <!-- Hover tooltip anchor for herb/book descriptions. The shared
       @shared/dom/tooltip primitive renders into this by id; kept a sibling of
       #root so React never manages it. Styled by the .hover-tooltip rules. -->
  <div id="hover-tooltip" class="hover-tooltip"></div>
  <!-- SPIKE: offscreen host for the built-in map panel. The shared MapPanel
       relocates #map into whichever dock/float shell owns it; EmbeddedMap binds
       to #map by id, so it must exist (attached) before the map is mounted. -->
  <div id="fu-offscreen" aria-hidden="true"
       style="position:fixed;left:-9999px;top:0;width:1px;height:1px;overflow:hidden">
    <div id="map"></div>
    <div id="objects-list"></div>
  </div>
  <script type="module" src="./main.tsx"></script>
</body>
</html>
