name: Test
on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Run client tests
        run: yarn --cwd client test
      - name: Run web client unit tests
        run: yarn --cwd web-client test
      - name: Build web client
        run: yarn --cwd web-client build
      - name: Install Playwright browsers
        run: yarn --cwd web-client playwright install --with-deps chromium
      - name: Run web client e2e tests
        env:
          CI: '1'
        run: yarn --cwd web-client test:e2e --reporter=line
