name: Test and Deploy
on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

permissions:
  pages: write
  id-token: write
  checks: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: yarn
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-dependencies-${{ hashFiles('package.json', 'yarn.lock') }}
          restore-keys: |
            key: ${{ runner.os }}-dependencies-
      - name: Build project
        run: yarn build
      - name: Build plugin types
        if: github.ref == 'refs/heads/master'
        run: yarn build:types
      - name: Copy types tarball to dist
        if: github.ref == 'refs/heads/master'
        run: cp plugin-types/dist/*.tgz dist/
      - name: Upload dist artifact
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/
          retention-days: 1

  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: yarn
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-dependencies-${{ hashFiles('package.json', 'yarn.lock') }}
          restore-keys: |
            key: ${{ runner.os }}-dependencies-
      - name: Run unit tests
        env:
          CI: '1'
        run: yarn test
      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: unit-test-results
          path: test-results/junit.xml
          if-no-files-found: ignore
          retention-days: 7

  e2e-test:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: .cache/ms-playwright
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4, 5, 6, 7, 8]
        shardTotal: [8]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: yarn
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-dependencies-${{ hashFiles('package.json', 'yarn.lock') }}
          restore-keys: |
            key: ${{ runner.os }}-dependencies-
      - name: Cache Playwright browsers
        if: matrix.install_browsers == true
        uses: actions/cache@v5
        with:
          path: .cache/ms-playwright
          key: ${{ runner.os }}-playwright-browsers
          restore-keys: |
            ${{ runner.os }}-playwright-
      - name: Install Playwright browsers
        run: yarn playwright install --with-deps chromium
      - name: Run e2e tests (shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
        env:
          CI: '1'
        run: yarn test:e2e --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: blob-report-${{ matrix.shardIndex }}
          path: blob-report/
          if-no-files-found: ignore
          retention-days: 7

  test-report:
    if: always()
    needs: [unit-test, e2e-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: yarn
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Download all blob reports
        id: download-blob-reports
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true
      - name: Merge Playwright reports
        if: steps.download-blob-reports.outcome == 'success'
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_NAME: results.xml
        run: npx playwright merge-reports --reporter=html,junit ./all-blob-reports
      - name: Move merged JUnit report
        if: steps.download-blob-reports.outcome == 'success'
        run: |
          mkdir -p test-results
          mv results.xml test-results/e2e-junit.xml
      - name: Upload Playwright HTML report
        if: steps.download-blob-reports.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
      - name: Download unit test results
        id: download-unit-results
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: unit-test-results
          path: test-results/unit
      - name: Jest test report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Jest Tests
          path: test-results/unit/junit.xml
          reporter: jest-junit
      - name: Playwright test report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Playwright Tests
          path: test-results/e2e-junit.xml
          reporter: jest-junit

  deploy:
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: [build, unit-test, e2e-test]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
