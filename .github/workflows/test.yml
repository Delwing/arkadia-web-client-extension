name: Test and Deploy
on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: .cache/ms-playwright
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Run unit tests
            command: yarn test
          - name: Build project
            command: yarn build
          - name: Run e2e tests
            command: yarn test:e2e --reporter=line
            install_browsers: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-dependencies-${{ hashFiles('package.json', 'yarn.lock') }}
          restore-keys: |
            key: ${{ runner.os }}-dependencies-
      - name: Cache Playwright browsers
        if: matrix.install_browsers == true
        uses: actions/cache@v4
        with:
          path: .cache/ms-playwright
          key: ${{ runner.os }}-playwright-browsers
          restore-keys: |
            ${{ runner.os }}-playwright-
      - name: Install Playwright browsers
        if: matrix.install_browsers == true
        run: yarn playwright install --with-deps chromium
      - name: ${{ matrix.name }}
        env:
          CI: '1'
        run: ${{ matrix.command }}
      - name: Upload dist artifact
        if: matrix.name == 'Build project' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  deploy:
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Build project
        run: yarn build
      - name: Build plugin types
        run: yarn build:types
      - name: Copy types tarball to dist
        run: cp plugin-types/dist/*.tgz dist/
      - name: Setup Pages
        uses: actions/configure-pages@v2
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
