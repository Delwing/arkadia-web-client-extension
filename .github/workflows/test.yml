name: Test and Deploy
on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

permissions:
  pages: write
  id-token: write
  checks: write
  attestations: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: yarn
      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-node24-modules-${{ hashFiles('yarn.lock') }}
      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: yarn install --frozen-lockfile
      - name: Build project
        run: yarn build
      - name: Build plugin types
        if: github.ref == 'refs/heads/master'
        run: yarn build:types
      - name: Copy types tarball to dist
        if: github.ref == 'refs/heads/master'
        run: cp plugin-types/dist/*.tgz dist/
      - name: Upload dist artifact
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/
          retention-days: 1

  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: yarn
      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-node24-modules-${{ hashFiles('yarn.lock') }}
      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: yarn install --frozen-lockfile
      - name: Run unit tests
        env:
          CI: '1'
        run: yarn test --reporter=default --reporter=junit --outputFile.junit=test-results/junit.xml
      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: unit-test-results
          path: test-results/junit.xml
          if-no-files-found: ignore
          retention-days: 7

  build-helper:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            goos: windows
            goarch: amd64
            suffix: '.exe'
            cgo: '0'
          - runner: ubuntu-latest
            goos: windows
            goarch: arm64
            suffix: '.exe'
            cgo: '0'
          - runner: macos-latest
            goos: darwin
            goarch: amd64
            suffix: ''
            cgo: '1'
          - runner: macos-latest
            goos: darwin
            goarch: arm64
            suffix: ''
            cgo: '1'
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
            suffix: ''
            cgo: '0'
          - runner: ubuntu-latest
            goos: linux
            goarch: arm64
            suffix: ''
            cgo: '0'
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24'
          cache-dependency-path: helper/go.sum
      - name: Build helper
        working-directory: helper
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.cgo }}
        run: |
          COMMIT=$(git rev-parse --short HEAD)
          LDFLAGS="-s -w -X main.Version=$COMMIT"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            LDFLAGS="$LDFLAGS -H windowsgui"
          fi
          go build -ldflags="$LDFLAGS" -o ../arkadia-helper-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }} .
      - name: Attest helper binary
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: arkadia-helper-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }}
      - name: Upload helper artifact
        uses: actions/upload-artifact@v6
        with:
          name: helper-${{ matrix.goos }}-${{ matrix.goarch }}
          path: arkadia-helper-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }}
          retention-days: 1

  e2e-test:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: .cache/ms-playwright
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4, 5, 6, 7, 8]
        shardTotal: [8]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: yarn
      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-node24-modules-${{ hashFiles('yarn.lock') }}
      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: yarn install --frozen-lockfile
      - name: Resolve Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('./node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: .cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: yarn playwright install chromium
      - name: Run e2e tests (shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
        env:
          CI: '1'
        run: yarn test:e2e --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: blob-report-${{ matrix.shardIndex }}
          path: blob-report/
          if-no-files-found: ignore
          retention-days: 7

  test-report:
    if: always()
    needs: [unit-test, e2e-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: yarn
      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-node24-modules-${{ hashFiles('yarn.lock') }}
      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: yarn install --frozen-lockfile
      - name: Download all blob reports
        id: download-blob-reports
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true
      - name: Merge Playwright reports
        if: steps.download-blob-reports.outcome == 'success'
        continue-on-error: true
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_NAME: test-results/e2e-junit.xml
        run: npx playwright merge-reports --reporter=html,junit ./all-blob-reports
      - name: Upload Playwright HTML report
        if: steps.download-blob-reports.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
      - name: Download unit test results
        id: download-unit-results
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: unit-test-results
          path: test-results/unit
      - name: Unit test report
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: Unit Tests
          path: test-results/unit/junit.xml
          reporter: java-junit
          fail-on-error: 'false'
      - name: Playwright test report
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: Playwright Tests
          path: test-results/e2e-junit.xml
          reporter: jest-junit
          fail-on-error: 'false'

  deploy:
    needs: [build, build-helper, unit-test, e2e-test]
    if: always() && github.ref == 'refs/heads/master' && github.event_name != 'pull_request' && needs.build.result == 'success' && needs.unit-test.result == 'success' && needs.e2e-test.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: ' '
          sparse-checkout-cone-mode: false
      - name: Download dist artifact
        uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist
      - name: Download helper binaries
        continue-on-error: true
        id: download-helpers
        uses: actions/download-artifact@v7
        with:
          pattern: helper-*
          path: dist/helper
          merge-multiple: true
      - name: Generate helper version file
        if: steps.download-helpers.outcome == 'success'
        run: echo "$(git rev-parse --short HEAD)" > dist/helper/version.txt
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
