<!doctype html>
<html lang="en">
<head>
    <!-- Google tag (gtag.js) -->
    <script>
        // Only load Google Analytics on the production host and not in test mode,
        // so forks, previews and local runs stay out of the stats
        if (!window.__DISABLE_GA__ && location.hostname === 'delwing.github.io') {
            (function() {
                var script = document.createElement('script');
                script.async = true;
                script.src = 'https://www.googletagmanager.com/gtag/js?id=G-25FPEMWGME';
                document.head.appendChild(script);

                window.dataLayer = window.dataLayer || [];
                function gtag(){dataLayer.push(arguments);}
                gtag('js', new Date());
                gtag('config', 'G-25FPEMWGME');
            })();
        }
    </script>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
    <meta name="apple-mobile-web-app-capable" content="yes"/>
    <meta name="mobile-web-app-capable" content="yes"/>
    <meta name="theme-color" content="#000000" />
    <meta name="ai-instructions" content="AI instructions located under /llms.txt" />
    <meta name="ai-agent-guide" content="AI instructions located under /llms.txt" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&family=Cinzel:wght@500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <title>Arkadia</title>
</head>
<!-- data-mobile-footer / data-footer-expand default to the compact phone footer
     with its expander, so both are there from the first paint;
     uiSettingsCore.apply() rewrites them from the player's settings. -->
<body data-map-position="top-overlay" data-mobile-footer="1" data-footer-expand="toggle">
<div id="main-container">
    <div id="content-area">
        <div id="layout-manager-root"></div>
        <div id="iframe-container">
            <div id="map"></div>
            <div id="location-wrapper">
                <div id="location-label">
                    <span id="location-text"></span>
                </div>
                <span id="pause-icon"></span>
            </div>
            <div id="map-lost-wrapper"></div>
            <div id="map-progress-container" class="map-progress">
                <div class="map-progress__track">
                    <div id="map-progress-bar" class="map-progress__bar"
                         style="width: 0"></div>
                </div>
            </div>
        </div>
        <div id="main_text_output_msg_wrapper">
            <div id="notification-center" data-output-keep></div>
            <div id="split-bottom" class="split-hidden">
                <div id="split-handle"></div>
                <div id="sticky-area"></div>
                <button id="split-close" type="button" title="Dwuklik w okno też zamyka">Zamknij</button>
            </div>
        </div>
        <div id="compass-rose-box" class="compass-rose-box" style="display:none">
            <div class="compass-rose-special-exits"></div>
            <div class="compass-rose-grid">
                <span class="cr-dir" data-dir="nw">NW</span>
                <span class="cr-dir" data-dir="n">N</span>
                <span class="cr-dir" data-dir="ne">NE</span>
                <span class="cr-dir cr-ud" data-dir="u">U</span>
                <span class="cr-dir" data-dir="w">W</span>
                <span class="cr-center">X</span>
                <span class="cr-dir" data-dir="e">E</span>
                <span class="cr-sep"></span>
                <span class="cr-dir" data-dir="sw">SW</span>
                <span class="cr-dir" data-dir="s">S</span>
                <span class="cr-dir" data-dir="se">SE</span>
                <span class="cr-dir cr-ud" data-dir="d">D</span>
            </div>
        </div>
    </div>
    <!-- The footer: #multi-binds and #char-state, as @web-ui/footer/layout arranges them. -->
    <div id="footer-layout"></div>
    <div id="objects-list" data-mobile-command-radial-ignore></div>
    <!-- Non-team objects, filled by ObjectList and shown only as its own layout window. -->
    <div id="objects-list-others" data-mobile-command-radial-ignore></div>
    <button id="recording-button" type="button" class="popup-btn popup-btn--control popup-btn--sm recordings-rec" style="display:none;">Zatrzymaj i zapisz</button>

    <span id="content-width-measure" style="visibility:hidden;position:absolute;white-space:pre">M</span>
    <!-- Page-level windows (Ustawienia, Klawisze, Miejsca…): src/web/app/AppModals.tsx,
         opened by id through src/web/modals/appModal.ts; styled in style.css ("app-modal"). -->
    <div id="app-modals" style="display: contents"></div>
    <div id="knowledge-root"></div>
    <div id="knowledge-details-root"></div>
    <div id="clock-root"></div>
    <div id="contracts-root"></div>
    <!-- Command line (history, field, microphone, send, the menu): CommandLine.tsx -->
    <div id="command-line-root" style="display: contents"></div>

    <div id="layout-bottom-dock-host"></div>
    <!-- The side docks portal here when they span the full height (layout.css). -->
    <div id="layout-left-dock-host"></div>
    <div id="layout-right-dock-host"></div>

    <!-- Logowanie: src/web/auth/AuthOverlay.tsx (#auth-overlay and the ids password
         managers recognise). -->
    <div id="auth-root" style="display: contents"></div>


    <div id="logs-modal" class="app-modal app-modal--logs" hidden>
        <div class="app-modal__dialog app-modal__dialog--xl app-modal__dialog--fill app-modal__dialog--phone-full logs-modal-dialog" tabindex="-1">
            <!-- No header of the shell: the viewer renders its own, with the
                 session title, the export menu and the close control. -->
            <div class="app-modal__body app-modal__body--panel logs-modal-body">
                <!-- Filled by logBrowserMount.tsx -->
            </div>
        </div>
    </div>

    <!-- #mobile-direction-buttons is now rendered by the shared
         MobileDirectionButtons React component (src/ui/web/buttons), mounted
         in main.ts — it portals to document.body itself. -->
    <!-- #mobile-command-radial is now rendered by the shared
         MobileCommandRadial React component (src/ui/web/buttons), mounted
         in main.ts — it portals to document.body itself. -->
</div>
<div id="letter-composer-root"></div>
<div id="herb-ui-root"></div>
<div id="map-note-tooltip" class="map-note-tooltip"></div>
<div id="hover-tooltip" class="hover-tooltip"></div>
<script type="module" src="/src/web/main.ts"></script>
<script type="module" src="/src/web/logBrowserMount.tsx"></script>
</body>
</html>
