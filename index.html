<!doctype html>
<html lang="en">
<head>
    <!-- Google tag (gtag.js) -->
    <script>
        // Only load Google Analytics if not in test mode
        if (!window.__DISABLE_GA__) {
            (function() {
                var script = document.createElement('script');
                script.async = true;
                script.src = 'https://www.googletagmanager.com/gtag/js?id=G-25FPEMWGME';
                document.head.appendChild(script);

                window.dataLayer = window.dataLayer || [];
                function gtag(){dataLayer.push(arguments);}
                gtag('js', new Date());
                gtag('config', 'G-25FPEMWGME');
            })();
        }
    </script>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
    <meta name="apple-mobile-web-app-capable" content="yes"/>
    <meta name="mobile-web-app-capable" content="yes"/>
    <meta name="theme-color" content="#000000" />
    <meta name="ai-instructions" content="AI instructions located under /llms.txt" />
    <meta name="ai-agent-guide" content="AI instructions located under /llms.txt" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <title>Arkadia</title>
    <!-- src/web/main.ts loads the chosen shell (stock or forge) with its styles and
         then removes this; until then the unstyled stock markup stays hidden.
         Removed rather than left inert, as popped-out windows copy the page's styles. -->
    <style id="shell-boot-style">html:not([data-shell-ready]) body{visibility:hidden}html:not([data-shell-ready]){background:#000}</style>
</head>
<!-- data-mobile-footer / data-footer-expand default to the compact phone footer
     with its expander, so both are there from the first paint;
     uiSettingsCore.apply() rewrites them from the player's settings. -->
<body data-map-position="top-overlay" data-mobile-footer="1" data-footer-expand="toggle">
<div id="main-container">
    <!-- Rail hosts: with the side docks spanning the full height, the left/right
         dock areas portal in here (src/web/layout, stockRails.css). -->
    <div id="layout-left-dock-host"></div>
    <div id="layout-right-dock-host"></div>
    <div id="content-area">
        <div id="layout-manager-root"></div>
        <div id="iframe-container">
            <div id="map"></div>
            <div id="location-wrapper">
                <div id="location-label">
                    <span id="location-text"></span>
                </div>
                <span id="pause-icon"></span>
            </div>
            <div id="map-lost-wrapper"></div>
            <div id="map-progress-container" class="map-progress">
                <div class="map-progress__track">
                    <div id="map-progress-bar" class="map-progress__bar"
                         style="width: 0"></div>
                </div>
            </div>
        </div>
        <div id="main_text_output_msg_wrapper">
            <div id="notification-center"></div>
            <div id="split-bottom" class="split-hidden">
                <div id="split-handle"></div>
                <div id="sticky-area"></div>
            </div>
        </div>
        <div id="compass-rose-box" class="compass-rose-box" style="display:none">
            <div class="compass-rose-special-exits"></div>
            <div class="compass-rose-grid">
                <span class="cr-dir" data-dir="nw">NW</span>
                <span class="cr-dir" data-dir="n">N</span>
                <span class="cr-dir" data-dir="ne">NE</span>
                <span class="cr-dir cr-ud" data-dir="u">U</span>
                <span class="cr-dir" data-dir="w">W</span>
                <span class="cr-center">X</span>
                <span class="cr-dir" data-dir="e">E</span>
                <span class="cr-sep"></span>
                <span class="cr-dir" data-dir="sw">SW</span>
                <span class="cr-dir" data-dir="s">S</span>
                <span class="cr-dir" data-dir="se">SE</span>
                <span class="cr-dir cr-ud" data-dir="d">D</span>
            </div>
        </div>
    </div>
    <div id="multi-binds"></div>
    <!-- Status line (vitals, chips): @web-ui/footer/StatusLine.tsx -->
    <div id="char-state"></div>
    <div id="objects-list" data-mobile-command-radial-ignore></div>
    <button id="recording-button" type="button" class="popup-btn popup-btn--control popup-btn--sm recordings-rec" style="display:none;">Zatrzymaj i zapisz</button>

    <span id="content-width-measure" style="visibility:hidden;position:absolute;white-space:pre">M</span>
    <!-- Page-level windows, opened by id through src/web/modals/appModal.ts;
         styled in style.css ("app-modal"). -->
    <div id="settings-modal" class="app-modal app-modal--settings" hidden>
        <div class="app-modal__dialog app-modal__dialog--xl app-modal__dialog--fill app-modal__dialog--phone-full" tabindex="-1">
            <div class="app-modal__header">
                <h2 class="app-modal__title">Ustawienia</h2>
                <button type="button" class="popup-btn popup-btn--control popup-btn--sm" id="settings-characters-btn">Postacie</button>
                <button type="button" class="app-modal__close" data-modal-dismiss title="Zamknij">&times;</button>
            </div>
            <div class="app-modal__body app-modal__body--panel">
                <div id="settings-root" class="app-modal__panel"></div>
            </div>
            <div class="app-modal__footer">
                <!-- Shown while something is unsaved; closing keeps the edits for the next opening. -->
                <button type="button" class="popup-btn popup-btn--control" id="settings-discard" title="Wróć do zapisanych ustawień" hidden>Odrzuć zmiany</button>
                <button type="button" class="popup-btn popup-btn--control popup-btn--solid" id="settings-save">Zapisz</button>
            </div>
        </div>
    </div>
    <div id="character-management-modal" class="app-modal" hidden>
        <div class="app-modal__dialog" tabindex="-1">
            <div class="app-modal__header">
                <h2 class="app-modal__title">Zarządzanie postaciami</h2>
                <button type="button" class="app-modal__close" data-modal-dismiss title="Zamknij">&times;</button>
            </div>
            <div class="app-modal__body">
                <div id="character-management-root"></div>
            </div>
        </div>
    </div>
    <div id="binds-modal" class="app-modal" hidden>
        <div class="app-modal__dialog app-modal__dialog--keys app-modal__dialog--phone-full" tabindex="-1">
            <!-- Keys (src/web/keys/Keys.tsx) puts its keymap toolbar in the header slot.
                 Every change is stored at once, so there is no footer. -->
            <div class="app-modal__header">
                <h2 class="app-modal__title">Klawisze</h2>
                <div id="binds-header-slot" class="app-modal__header-slot"></div>
                <button type="button" class="app-modal__close" data-modal-dismiss title="Zamknij">&times;</button>
            </div>
            <div class="app-modal__body app-modal__body--flush">
                <div id="binds-options"></div>
            </div>
        </div>
    </div>
    <div id="scripts-modal" class="app-modal" hidden>
        <div class="app-modal__dialog app-modal__dialog--xl app-modal__dialog--fill" tabindex="-1">
            <div class="app-modal__header">
                <h2 class="app-modal__title">Skrypty</h2>
                <button type="button" class="app-modal__close" data-modal-dismiss title="Zamknij">&times;</button>
            </div>
            <!-- The panel scrolls its own list under a fixed tab bar and toolbar,
                 so the body itself must not scroll. -->
            <div class="app-modal__body app-modal__body--panel">
                <div id="scripts-options" class="app-modal__panel"></div>
            </div>
        </div>
    </div>
    <div id="automation-modal" class="app-modal" hidden>
        <div class="app-modal__dialog app-modal__dialog--automation app-modal__dialog--phone-full" tabindex="-1">
            <div class="app-modal__header">
                <h2 class="app-modal__title">Automatyzacja</h2>
                <button type="button" class="app-modal__close" data-modal-dismiss title="Zamknij">&times;</button>
            </div>
            <div class="app-modal__body app-modal__body--flush">
                <div id="automation-options"></div>
            </div>
        </div>
    </div>
    <div id="recordings-modal" class="app-modal" hidden>
        <div class="app-modal__dialog app-modal__dialog--lg" tabindex="-1">
            <div class="app-modal__header">
                <h2 class="app-modal__title">Nagrania</h2>
                <button type="button" class="app-modal__close" data-modal-dismiss title="Zamknij">&times;</button>
            </div>
            <div class="app-modal__body">
                <div id="recordings-options"></div>
            </div>
        </div>
    </div>
    <div id="places-modal" class="app-modal" hidden>
        <div class="app-modal__dialog app-modal__dialog--xl app-modal__dialog--phone-full" tabindex="-1">
            <div class="app-modal__header">
                <h2 class="app-modal__title">Miejsca</h2>
                <button type="button" class="app-modal__close" data-modal-dismiss title="Zamknij">&times;</button>
            </div>
            <div class="app-modal__body app-modal__body--flush">
                <div id="places-options"></div>
            </div>
        </div>
    </div>
    <div id="helper-modal" class="app-modal" hidden>
        <div class="app-modal__dialog" tabindex="-1">
            <div class="app-modal__header">
                <h2 class="app-modal__title">Arkadia Helper</h2>
                <button type="button" class="app-modal__close" data-modal-dismiss title="Zamknij">&times;</button>
            </div>
            <div class="app-modal__body app-modal__body--flush">
                <div id="helper-options"></div>
            </div>
        </div>
    </div>
    <div id="knowledge-root"></div>
    <div id="knowledge-details-root"></div>
    <div id="clock-root"></div>
    <div id="contracts-root"></div>
    <!-- Command line (history, field, microphone, send, the menu): CommandLine.tsx -->
    <div id="command-line-root" style="display: contents"></div>

    <div id="layout-bottom-dock-host"></div>

    <!-- Logowanie: the ids are what main.ts wires and what password managers
         recognise; the connection footer (#proxy-controls-root) is ProxyControls.tsx. -->
    <div id="auth-overlay">
        <div id="auth-notify" class="auth-notify">
            <span class="auth-notify__icon"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg></span>
            <span class="auth-notify__text"><span>Powiadomienia wyłączone.</span> <span class="auth-dim auth-notify__more">Nie dowiesz się o wiadomościach, gdy karta jest w tle.</span></span>
            <button id="enable-notifications-connection" type="button" class="auth-btn auth-btn--sm">Włącz</button>
            <button id="auth-notify-dismiss" type="button" class="auth-ib auth-ib--sm" title="Nie teraz"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button>
        </div>
        <div class="auth-top">
            <button id="auth-close" type="button" class="auth-btn auth-btn--ghost auth-btn--sm">Bez połączenia<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button>
        </div>
        <section id="auth-panel">
            <img src="logo.png" class="auth-logo" alt="Dargoth Client" />
            <div class="auth-body">
                <h1 class="auth-title">Wejdź do Arkadii</h1>
                <div id="connecting-spinner"><span class="auth-spinner"></span>Łączenie…</div>
                <div id="system-login-message"></div>
                <form id="login-form">
                    <label class="auth-field"><span class="auth-label">Postać</span>
                        <input id="login-character" class="auth-input" type="text" autocomplete="username" spellcheck="false" autofocus></label>
                    <label class="auth-field"><span class="auth-label">Hasło</span>
                        <span class="auth-pass">
                            <input id="login-password" type="password" autocomplete="current-password">
                            <button id="login-password-toggle" type="button" class="auth-ib" title="Pokaż hasło"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"></path><circle cx="12" cy="12" r="3"></circle></svg></button>
                        </span></label>
                    <button id="login-submit" class="auth-btn auth-btn--solid auth-btn--lg" type="submit">Zaloguj</button>
                </form>
                <div class="auth-or"><span></span>albo<span></span></div>
                <button id="connect-button" type="button" class="auth-btn auth-btn--two">
                    <span>Połącz bez logowania</span><span class="auth-muted">nowa postać albo logowanie w grze</span>
                </button>
            </div>
            <div id="proxy-controls-root" class="auth-conn"></div>
        </section>
        <div class="auth-meta">
            <a class="auth-coffee" href="https://buycoffee.to/dargoth" target="_blank" rel="noopener noreferrer"><img src="https://buycoffee.to/static/img/share/share-button-primary--pl.png" alt="Postaw kawę dla dargoth na buycoffee.to"></a>
            <div id="commit-info"></div>
        </div>
    </div>


    <div id="logs-modal" class="app-modal app-modal--logs" hidden>
        <div class="app-modal__dialog app-modal__dialog--xl app-modal__dialog--fill app-modal__dialog--phone-full logs-modal-dialog" tabindex="-1">
            <!-- No header of the shell: the viewer renders its own, with the
                 session title, the export menu and the close control. -->
            <div class="app-modal__body app-modal__body--panel logs-modal-body">
                <!-- Filled by logBrowserMount.tsx -->
            </div>
        </div>
    </div>

    <div id="location-share-modal" class="app-modal" hidden>
        <div class="app-modal__dialog" tabindex="-1">
            <div class="app-modal__header">
                <h2 class="app-modal__title">Kod QR lokacji</h2>
                <button type="button" class="app-modal__close" data-modal-dismiss title="Zamknij">&times;</button>
            </div>
            <div class="app-modal__body app-modal__body--center">
                <img id="location-qr-image" alt="QR code">
            </div>
        </div>
    </div>

    <!-- #mobile-direction-buttons is now rendered by the shared
         MobileDirectionButtons React component (src/ui/web/buttons), mounted
         in main.ts — it portals to document.body itself. -->
    <!-- #mobile-command-radial is now rendered by the shared
         MobileCommandRadial React component (src/ui/web/buttons), mounted
         in main.ts — it portals to document.body itself. -->
</div>
<div id="letter-composer-root"></div>
<div id="herb-ui-root"></div>
<div id="map-note-tooltip" class="map-note-tooltip"></div>
<div id="hover-tooltip" class="hover-tooltip"></div>
<script type="module" src="/src/web/main.ts"></script>
</body>
</html>
