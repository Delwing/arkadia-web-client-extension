<!doctype html>
<html lang="en">
<head>
    <!-- Google tag (gtag.js) -->
    <script>
        // Only load Google Analytics if not in test mode
        if (!window.__DISABLE_GA__) {
            (function() {
                var script = document.createElement('script');
                script.async = true;
                script.src = 'https://www.googletagmanager.com/gtag/js?id=G-25FPEMWGME';
                document.head.appendChild(script);

                window.dataLayer = window.dataLayer || [];
                function gtag(){dataLayer.push(arguments);}
                gtag('js', new Date());
                gtag('config', 'G-25FPEMWGME');
            })();
        }
    </script>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
    <meta name="apple-mobile-web-app-capable" content="yes"/>
    <meta name="mobile-web-app-capable" content="yes"/>
    <meta name="theme-color" content="#000000" />
    <meta name="ai-instructions" content="AI instructions located under /llms.txt" />
    <meta name="ai-agent-guide" content="AI instructions located under /llms.txt" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <title>Arkadia</title>
</head>
<!-- data-mobile-footer / data-footer-expand default to the compact phone footer
     with its expander, so both are there from the first paint;
     uiSettingsCore.apply() rewrites them from the player's settings. -->
<body data-map-position="top-overlay" data-mobile-footer="1" data-footer-expand="toggle">
<div id="main-container">
    <div id="content-area">
        <div id="layout-manager-root"></div>
        <div id="iframe-container">
            <div id="map"></div>
            <div id="location-wrapper">
                <div id="location-label">
                    <span id="location-text"></span>
                </div>
                <span id="pause-icon"></span>
            </div>
            <div id="map-lost-wrapper"></div>
            <div id="map-progress-container" class="position-absolute top-50 start-50 translate-middle w-75">
                <div class="progress">
                    <div id="map-progress-bar" class="progress-bar progress-bar-striped progress-bar-animated"
                         style="width: 0"></div>
                </div>
            </div>
        </div>
        <div id="main_text_output_msg_wrapper">
            <div id="notification-center"></div>
            <div id="split-bottom" class="split-hidden">
                <div id="split-handle"></div>
                <div id="sticky-area"></div>
            </div>
        </div>
        <div id="compass-rose-box" class="compass-rose-box" style="display:none">
            <div class="compass-rose-special-exits"></div>
            <div class="compass-rose-grid">
                <span class="cr-dir" data-dir="nw">NW</span>
                <span class="cr-dir" data-dir="n">N</span>
                <span class="cr-dir" data-dir="ne">NE</span>
                <span class="cr-dir cr-ud" data-dir="u">U</span>
                <span class="cr-dir" data-dir="w">W</span>
                <span class="cr-center">X</span>
                <span class="cr-dir" data-dir="e">E</span>
                <span class="cr-sep"></span>
                <span class="cr-dir" data-dir="sw">SW</span>
                <span class="cr-dir" data-dir="s">S</span>
                <span class="cr-dir" data-dir="se">SE</span>
                <span class="cr-dir cr-ud" data-dir="d">D</span>
            </div>
        </div>
    </div>
    <div id="multi-binds"></div>
    <!-- Status line (vitals, chips): @web-ui/footer/StatusLine.tsx -->
    <div id="char-state"></div>
    <div id="objects-list" data-mobile-command-radial-ignore></div>
    <button id="recording-button" type="button" class="popup-btn popup-btn--control popup-btn--sm recordings-rec" style="display:none;">Zatrzymaj i zapisz</button>

    <span id="content-width-measure" style="visibility:hidden;position:absolute;white-space:pre">M</span>
    <div id="settings-modal" class="modal fade" tabindex="-1">
        <div class="modal-dialog modal-dialog-scrollable modal-fullscreen-md-down h-100">
            <div class="modal-content h-100">
                <div class="modal-header">
                    <h5 class="modal-title">Ustawienia</h5>
                    <div class="d-flex align-items-center gap-2 ms-auto">
                        <button type="button" class="btn btn-secondary btn-sm rounded-pill px-2 py-0" style="font-size: 0.75rem;" id="settings-characters-btn">Postacie</button>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                </div>
                <div class="modal-body p-0 d-flex flex-column overflow-hidden" style="min-height:0;">
                    <div id="settings-root" class="h-100 flex-grow-1 overflow-hidden" style="min-height:0;"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary" id="settings-save">Zapisz</button>
                </div>
            </div>
        </div>
    </div>
    <div id="character-management-modal" class="modal fade" tabindex="-1" style="z-index: 1060;">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Zarządzanie postaciami</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div id="character-management-root"></div>
                </div>
            </div>
        </div>
    </div>
    <div id="binds-modal" class="modal fade" tabindex="-1">
        <div class="modal-dialog modal-lg modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Bindowanie</h5>
                    <div class="d-flex align-items-center gap-2 ms-auto">
                        <button type="button" class="btn btn-secondary btn-sm rounded-pill px-2 py-0" style="font-size: 0.75rem;" id="binds-import-btn">Importuj bazę multibindów…</button>
                        <span id="binds-import-spinner" class="spinner-border spinner-border-sm d-none" role="status"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                </div>
                <div class="modal-body">
                    <div id="binds-options"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary me-auto" id="binds-add-custom">Dodaj skrót</button>
                    <button type="button" class="btn btn-primary" id="binds-save">Zapisz</button>
                </div>
            </div>
        </div>
    </div>
    <div id="scripts-modal" class="modal fade" tabindex="-1">
        <div class="modal-dialog modal-xl modal-dialog-scrollable h-100">
            <div class="modal-content h-100">
                <div class="modal-header">
                    <h5 class="modal-title">Skrypty</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <!-- The panel scrolls its own list under a fixed tab bar and toolbar
                     (like #options-modal), so the body itself must not scroll. -->
                <div class="modal-body p-0 d-flex flex-column overflow-hidden" style="min-height:0;">
                    <div id="scripts-options" class="h-100 flex-grow-1 overflow-hidden" style="min-height:0;"></div>
                </div>
            </div>
        </div>
    </div>
    <div id="aliases-modal" class="modal fade" tabindex="-1">
        <div class="modal-dialog modal-lg modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Aliasy</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div id="aliases-options"></div>
                </div>
            </div>
        </div>
    </div>
    <div id="triggers-modal" class="modal fade" tabindex="-1">
        <div class="modal-dialog modal-lg modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Triggery</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div id="triggers-options"></div>
                </div>
            </div>
        </div>
    </div>
    <div id="recordings-modal" class="modal fade" tabindex="-1">
        <div class="modal-dialog modal-lg modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Nagrania</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div id="recordings-options"></div>
                </div>
            </div>
        </div>
    </div>
    <div id="places-modal" class="modal fade" tabindex="-1">
        <div class="modal-dialog modal-xl modal-fullscreen-md-down">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Miejsca</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div id="places-options"></div>
                </div>
            </div>
        </div>
    </div>
    <div id="helper-modal" class="modal fade" tabindex="-1">
        <div class="modal-dialog modal-xl">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Arkadia Helper</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-0">
                    <div id="helper-options"></div>
                </div>
            </div>
        </div>
    </div>
    <div id="knowledge-root"></div>
    <div id="knowledge-details-root"></div>
    <div id="clock-root"></div>
    <div id="contracts-root"></div>
    <!-- Command line (history, field, microphone, send, the menu): CommandLine.tsx -->
    <div id="command-line-root" style="display: contents"></div>

    <div id="layout-bottom-dock-host"></div>

    <div id="auth-overlay">
        <button id="auth-close" class="overlay-close">✖</button>
        <button id="enable-notifications-connection" class="btn btn-warning btn-sm">Włącz powiadomienia</button>
        <div id="auth-panel">
            <img src="logo.png" class="logo mb-3" alt="Logo" />
            <div id="connecting-spinner" class="spinner-border text-light"></div>
            <button id="connect-button">Połącz</button>
            <div class="auth-or">- LUB -</div>
            <form id="login-form" class="d-flex flex-column gap-2 mb-1">
                <input id="login-character" class="form-control" placeholder="Postać" autocomplete="username" autofocus>
                <input id="login-password" type="password" class="form-control" placeholder="Hasło" autocomplete="current-password">
                <button id="login-submit" class="btn btn-primary" type="submit">Zaloguj</button>
            </form>
            <div id="system-login-message"></div>
            <div class="form-check mt-3">
                <input class="form-check-input" type="checkbox" id="mccp-enabled" checked>
                <label class="form-check-label" for="mccp-enabled">Kompresja MCCP</label>
            </div>
            <div id="proxy-controls-root" class="mt-2"></div>
            <a href="https://buycoffee.to/dargoth" target="_blank" class="mt-4"><img src="https://buycoffee.to/static/img/share/share-button-primary.png" style="width: 146px; height: 38px" alt="Postaw mi kawę na buycoffee.to"></a>
        </div>
        <div id="layout-manager-suggestion" style="display: none;">
            <p>Wlacz menedzer okien, aby lepiej zarzadzac oknami na duzym ekranie.</p>
            <div class="d-flex gap-2">
                <button id="layout-suggestion-enable" class="btn btn-primary btn-sm">Wlacz</button>
                <button id="layout-suggestion-dismiss" class="btn btn-secondary btn-sm">Nie pokazuj wiecej</button>
            </div>
        </div>
        <div id="commit-info"></div>
    </div>


    <div id="logs-modal" class="modal fade" tabindex="-1">
        <div class="modal-dialog modal-xl modal-fullscreen-md-down logs-modal-dialog">
            <div class="modal-content">
                <!-- No Bootstrap header: the viewer renders its own, with the
                     session title, the export menu and the close control. -->
                <div class="modal-body logs-modal-body">
                    <!-- Filled by logBrowserMount.tsx -->
                </div>
            </div>
        </div>
    </div>

    <div id="location-share-modal" class="modal fade" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Kod QR lokacji</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body d-flex justify-content-center">
                    <img id="location-qr-image" alt="QR code">
                </div>
            </div>
        </div>
    </div>

    <!-- #mobile-direction-buttons is now rendered by the shared
         MobileDirectionButtons React component (src/ui/web/buttons), mounted
         in main.ts — it portals to document.body itself. -->
    <!-- #mobile-command-radial is now rendered by the shared
         MobileCommandRadial React component (src/ui/web/buttons), mounted
         in main.ts — it portals to document.body itself. -->
</div>
<div id="letter-composer-root"></div>
<div id="herb-ui-root"></div>
<div id="map-note-tooltip" class="map-note-tooltip"></div>
<div id="hover-tooltip" class="hover-tooltip"></div>
<script type="module" src="/src/web/main.ts"></script>
<script type="module" src="/src/web/logBrowserMount.tsx"></script>
</body>
</html>
