<!doctype html>
<html lang="pl">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#000000"/>
    <title>Arkadia - Alt UI (proof shell)</title>
    <style>
        :root { color-scheme: dark; }
        * { box-sizing: border-box; }
        html, body {
            margin: 0; height: 100%;
            background: #1a1a1a; color: #ddd;
            font-family: 'Fira Code', 'Cascadia Mono', 'Consolas', monospace;
            font-size: 14px;
        }
        body { display: flex; flex-direction: column; }
        #alt-toolbar {
            flex: 0 0 auto; display: flex; gap: 8px; align-items: center;
            padding: 6px 10px; background: #111; border-bottom: 1px solid #333;
        }
        #alt-toolbar button {
            background: #2b6; color: #061; border: none; border-radius: 4px;
            padding: 4px 12px; font: inherit; cursor: pointer; color: #012;
        }
        #alt-status { margin-left: auto; opacity: 0.75; }
        #alt-status.connected { color: #4d9; }
        #alt-status.disconnected { color: #d66; }
        /* The client's content-width measurer keys on these two ids. */
        #main_text_output_msg_wrapper {
            flex: 1 1 auto; overflow-y: auto; padding: 8px 12px;
            white-space: pre-wrap; word-break: break-word; line-height: 1.35;
        }
        .alt-line.alt-type-command { color: #7bd; }
        #content-width-measure {
            visibility: hidden; position: absolute; white-space: pre;
        }
        #alt-input {
            flex: 0 0 auto; background: #111; color: #eee; border: none;
            border-top: 1px solid #333; padding: 8px 12px; font: inherit;
        }
        #alt-input:focus { outline: none; background: #161616; }
    </style>
</head>
<body>
    <div id="alt-toolbar">
        <strong>Alt UI</strong>
        <span style="opacity:.6">— proof shell driving the client with no web UI</span>
        <button id="alt-connect" type="button">Connect</button>
        <span id="alt-status" class="disconnected">disconnected</span>
    </div>
    <div id="main_text_output_msg_wrapper"></div>
    <span id="content-width-measure">M</span>
    <input id="alt-input" type="text" autocomplete="off" spellcheck="false"
           placeholder="Type a command and press Enter…"/>
    <script type="module" src="./main.ts"></script>
</body>
</html>
