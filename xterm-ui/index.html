<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Arkadia — xterm</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; }
  #terminal { position: fixed; inset: 0 0 36px 0; }
  #cmd {
    position: fixed; left: 0; right: 0; bottom: 0; width: 100%; height: 36px;
    box-sizing: border-box; background: #111; color: #eee; border: none;
    border-top: 1px solid #333; font: 14px monospace; padding: 0 8px;
  }
  #cmd:focus { outline: none; }
</style>
</head>
<body>
  <div id="terminal"></div>
  <input id="cmd" type="text" autocomplete="off" autofocus placeholder="polacz i wpisz komende..." />
  <script type="module" src="./main.ts"></script>
</body>
</html>
